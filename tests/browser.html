<!doctype html><html><body><pre id="result">RUNNING</pre><iframe id="workspace" src="/" style="width:1200px;height:750px"></iframe>
<script>
const result = document.querySelector('#result');
const pause = () => new Promise(resolve => setTimeout(resolve, 80));
const check = (condition, message) => { if (!condition) throw Error(message); };
async function until(predicate) { for(let i=0;i<90;i++){if(await predicate())return;await pause();}throw Error('Timed out waiting for UI'); }
document.querySelector('iframe').onload = async () => {
 try {
  const w = document.querySelector('iframe').contentWindow, d = w.document;
  const api=async(path,body)=>{const project=new URLSearchParams(w.location.search).get('project')||'default';const r=await w.fetch(path+'?project='+encodeURIComponent(project),{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});return r.json()};
  await until(() => d.querySelector('#paper strong'));
  check(d.querySelector('#paper strong').textContent === 'careful', 'Markdown emphasis missing');
  check(d.querySelectorAll('#paper li').length === 2, 'Markdown list missing');
  check(d.querySelector('#paper pre code').textContent.includes('## code heading'), 'Fence parsed as heading');
  check(d.querySelector('#paper table td').textContent === 'world', 'Table missing');
  d.querySelector('#addSource').click();await until(()=>d.querySelector('#sourceForm'));
  const sourceForm=d.querySelector('#sourceForm'),titleField=d.querySelector('#sourceTitle'),fileField=d.querySelector('#sourceFile');
  const chooseFile=name=>{const transfer=new w.DataTransfer();transfer.items.add(new w.File(['Sample source'],name,{type:'text/plain'}));fileField.files=transfer.files;fileField.dispatchEvent(new w.Event('change',{bubbles:true}));};
  chooseFile('Prompt_Engineering-A_Survey.PDF');
  check(titleField.value==='Prompt Engineering A Survey','Filename title not suggested immediately');
  chooseFile('Another_Study.md');check(titleField.value==='Another Study','Unedited suggestion did not update for new file');
  titleField.value='My chosen title';titleField.dispatchEvent(new w.Event('input',{bubbles:true}));
  chooseFile('Replacement.txt');check(titleField.value==='My chosen title','File selection overwrote custom title');
  titleField.value='';titleField.dispatchEvent(new w.Event('input',{bubbles:true}));chooseFile('研究_Notes.txt');
  check(titleField.value==='研究 Notes','Clearing title did not allow a new Unicode suggestion');
  sourceForm.reset();chooseFile('Reset_Title.pdf');check(titleField.value==='Reset Title','Form reset did not reset suggestion state');
  fileField.value='';fileField.dispatchEvent(new w.Event('change',{bubbles:true}));check(titleField.value==='Reset Title','Cancelling file selection erased title');
  chooseFile('a'.repeat(220)+'.pdf');check(titleField.value.length===200,'Suggested title exceeds server limit');
  sourceForm.reset();d.querySelector('#cancelSource').click();await until(()=>!d.querySelector('#sourceForm'));
  const scroll=d.querySelector('.paper-scroll'),composer=d.querySelector('.composer');
  const lastSection=d.querySelector('#paper section:last-child');
  const checkLongPaper=async()=>{
    check(scroll.scrollHeight>scroll.clientHeight+100,'Long paper is not scrollable');
    const before=composer.getBoundingClientRect().top;
    scroll.scrollTop=scroll.scrollHeight;await pause();
    check(Math.abs(composer.getBoundingClientRect().top-before)<2,'Prompt moved while scrolling paper');
    check(lastSection.getBoundingClientRect().bottom<composer.getBoundingClientRect().top-4,'Conclusion is hidden beneath prompt');
    scroll.scrollTop=0;
  };
  await checkLongPaper();
  w.frameElement.style.width='800px';await pause();await checkLongPaper();
  w.frameElement.style.width='390px';await pause();await checkLongPaper();
  check(d.documentElement.scrollWidth<=390,'Mobile workspace overflows');
  d.querySelector('.mobile-outline').click();await pause();check(d.querySelector('.outline').getBoundingClientRect().height>0,'Mobile sources inaccessible');
  d.querySelector('.mobile-outline').click();await pause();
  w.frameElement.style.width='1200px';await pause();
  const paragraph = d.querySelector('.markdown-block p');
  const node = paragraph.querySelector('[data-source-start]').firstChild;
  const formatted = paragraph.querySelector('strong [data-source-start]').firstChild;
  const formattedRange = d.createRange();formattedRange.setStart(node,0);formattedRange.setEnd(formatted,formatted.length);
  w.getSelection().removeAllRanges();w.getSelection().addRange(formattedRange);
  d.querySelector('#paper').dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true}));await pause();
  check(!d.querySelector('#selectionContext').hidden && d.querySelector('#selectionContext').textContent.includes('Write **careful**'), 'Selection across Markdown formatting failed');
  const range = d.createRange(); range.setStart(node,0); range.setEnd(node,5);
  w.getSelection().removeAllRanges(); w.getSelection().addRange(range); d.querySelector('#paper').dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true}));await pause();
  check(!d.querySelector('#selectionContext').hidden, 'Selection context missing');
  const block = d.querySelector('.markdown-block'); await new Promise(resolve=>setTimeout(resolve,2000));
  check(block === d.querySelector('.markdown-block'), 'Polling replaced document nodes');
  check(w.getSelection().toString() === 'Write', 'Polling lost text selection');
  d.querySelector('#prompt').value = 'Rephrase the selected text'; await until(()=>!d.querySelector('#run').disabled);d.querySelector('#run').click();
  await until(()=>Array.from(d.querySelectorAll('#events button')).some(button=>button.textContent==='Allow'));
  check(!d.querySelector('#paper').textContent.includes('Compose'), 'Unchecked Allow all saved an edit without permission');
  Array.from(d.querySelectorAll('#events button')).find(button=>button.textContent==='Allow').click();
  await until(async () => { await pause(); return d.querySelector('#paper').textContent.includes('Compose'); });
  check(d.querySelector('#paper strong').textContent === 'careful', 'Selected edit changed surrounding content');
  d.querySelector('#allowAll').click();check(d.querySelector('#allowAll').checked,'Allow all could not be enabled');
  d.querySelector('#editMarkdown').click();await until(()=>d.querySelector('#markdownEditor'));
  d.querySelector('#markdownEditor').value = '# Revised document\n\n## Implementation\n\n- New step';
  d.querySelector('#markdownForm').requestSubmit();
  await until(() => d.querySelector('#paper h1').textContent === 'Revised document');
  check(d.querySelector('#paper li').textContent === 'New step', 'Saved draft not rendered');
  const exported = await (await w.fetch('/api/markdown')).text();
  check(exported.includes('# Revised document') && exported.includes('- New step'), 'Export is stale');
  await pause();check(d.querySelector('#paper h1').textContent === 'Revised document','Refresh lost saved draft');
  d.querySelector('#versions .version-item').click();await until(()=>d.querySelector('#versionDetail'));
  check(d.querySelector('#versionDetail').textContent.includes('Revised document'),'Version details missing');
  d.querySelector('#closeVersion').click();await until(()=>!d.querySelector('#versionDetail'));
  const previous = await api('/api/state');
  await api('/api/evidence',{title:'First project source',text:'Only for the first project.'});
  await until(()=>d.querySelector('#sources .source-item'));
  const sourceRow=d.querySelector('#sources .source-item');
  const sourceTitle=sourceRow.querySelector('.source-open'),sourceAction=sourceRow.querySelector('.source-reference');
  sourceTitle.querySelector('span').textContent='▣ Prompt Engineer: Analyzing Human-AI Interaction in Academic Research and Documentation';
  check(sourceTitle.getBoundingClientRect().width>sourceRow.getBoundingClientRect().width-8,'Long filename is squeezed by Add reference');
  check(sourceAction.getBoundingClientRect().top>=sourceTitle.getBoundingClientRect().bottom-1,'Add reference overlaps filename');
  w.frameElement.style.width='800px';await pause();
  check(sourceTitle.getBoundingClientRect().width>sourceRow.getBoundingClientRect().width-8,'Filename is squeezed at tablet width');
  w.frameElement.style.width='1200px';await pause();
  d.querySelector('#prompt').value='Update the introduction using this file';
  d.querySelector('#prompt').setSelectionRange(24,24);
  d.querySelector('#sources .source-reference').click();
  check(d.querySelector('#prompt').value.includes('Source: “First project source”'),'Reference not inserted into prompt');
  check(d.activeElement===d.querySelector('#prompt'),'Prompt did not receive focus');
  check(d.querySelectorAll('#sources .source-reference').length===1,'Source reference action missing');
  d.querySelector('#newProject').click();await until(()=>d.querySelector('#projectName'));d.querySelector('#projectName').value='Second project';d.querySelector('#projectForm').requestSubmit();
  await until(() => d.querySelector('#paper h1')?.textContent === 'Second project');
  const second = await api('/api/state');
  check(second.project.id !== previous.project.id, 'New project reused the original project');
  check(second.sources.length === 0 && second.jobs.length === 0 && second.versions.length === 1, 'Project data leaked');
  const oldVersion = await w.fetch('/api/version/'+previous.paper.id+'?project='+second.project.id);
  check(oldVersion.status === 404, 'Cross-project version lookup succeeded');
  const secondExport = await (await w.fetch(d.querySelector('#exportMarkdown').href)).text();
  check(secondExport.includes('# Second project') && !secondExport.includes('New step'), 'Export used wrong project');
  check(w.location.search.includes(second.project.id), 'Project selection not persisted in URL');
  d.querySelector('#prompt').value='Second project draft';
  d.querySelector('#projectSelect').value=previous.project.id;d.querySelector('#projectSelect').dispatchEvent(new w.Event('change',{bubbles:true}));
  await until(()=>d.querySelector('#paper h1')?.textContent==='Revised document');
  check(d.querySelector('#prompt').value.includes('Source: “First project source”'),'First project draft was lost');
  d.querySelector('#projectSelect').value=second.project.id;d.querySelector('#projectSelect').dispatchEvent(new w.Event('change',{bubbles:true}));
  await until(()=>d.querySelector('#paper h1')?.textContent==='Second project');
  check(d.querySelector('#prompt').value==='Second project draft','Second project draft was lost');
  d.querySelector('#prompt').value='Lets work on a papper titled can prompt engineering be a career option?';
  await until(()=>!d.querySelector('#run').disabled);d.querySelector('#run').click();
  await until(async () => {await pause();return d.querySelector('#paper h1')?.textContent === 'Can prompt engineering be a career option?';});
  check(!d.querySelector('#paper section'), 'Title request created a section');
  check(d.querySelector('#events').textContent.includes('1 document change(s) saved.'), 'Title change outcome missing');
  check(!d.querySelector('#allowAll').checked,'Allow all leaked into another project');
  d.querySelector('#allowAll').click();
  d.querySelector('#prompt').value='Add an unsupported claim';await until(()=>!d.querySelector('#run').disabled);d.querySelector('#run').click();
  await until(async()=>{await pause();return d.querySelector('#paper').textContent.includes('A statement accepted by the author.');});
  check(!d.querySelector('#paper').textContent.includes('Allowed by you'),'Source-free text carries an override warning');
  check(!Array.from(d.querySelectorAll('#events button')).some(button=>button.textContent==='Allow'),'Evidence override still offered');
  d.querySelector('#projectSelect').value=previous.project.id;d.querySelector('#projectSelect').dispatchEvent(new w.Event('change',{bubbles:true}));
  await until(() => d.querySelector('#paper h1')?.textContent === 'Revised document');
  check(d.querySelector('#sources').textContent.includes('First project source'), 'Original sources not restored');
  check(d.querySelector('#paper li').textContent === 'New step', 'Original draft was changed by project creation');
  d.querySelector('#editMarkdown').click();await until(()=>d.querySelector('#markdownEditor'));
  d.querySelector('#markdownEditor').value='# Paper\n\n## Introduction\n\nIntro.\n\n## Results\n\nResults.\n\n## Literature Survey\n\nSurvey text.\n\n## References\n\n- Citation';
  d.querySelector('#markdownForm').requestSubmit();
  await until(()=>d.querySelector('#paper h1')?.textContent==='Paper');
  d.querySelector('#prompt').value='Move the literature Surevy from bottom to after Introduction';
  await until(()=>!d.querySelector('#run').disabled);d.querySelector('#run').click();
  await until(async()=>{await pause();return Array.from(d.querySelectorAll('#paper section h2')).map(h=>h.textContent).join(',')==='Introduction,Literature Survey,Results,References';});
  check(d.querySelector('#paper').textContent.includes('Survey text.'),'Move lost section content');
  check(!d.querySelector('#events .activity-run .activity-event strong')?.textContent.includes('writer'),'Move unexpectedly used writer');
  d.querySelector('#sources .source-reference').click();
  d.querySelector('#prompt').value+=' Add an unsupported claim';
  await until(()=>!d.querySelector('#run').disabled);d.querySelector('#run').click();
  const sourceId=(await api('/api/state')).sources[0].id;
  await until(async()=>{const latest=(await api('/api/state')).jobs.at(-1);return latest?.status==='complete';});
  check((await api('/api/state')).jobs.at(-1).source_ids.includes(sourceId),'Selected source ID not sent with request');
  await until(()=>d.querySelector('#paper').textContent.includes('A statement accepted by the author.'));
  d.querySelector('#undo').click();
  await until(()=>!d.querySelector('#paper').textContent.includes('A statement accepted by the author.'));
  check(Array.from(d.querySelectorAll('#paper section h2')).map(h=>h.textContent).join(',')==='Introduction,Literature Survey,Results,References','Undo did not restore the draft before the source-free revision');
  check(d.querySelector('#paper').textContent.includes('Survey text.'),'Undo lost the original section');
  result.textContent = 'PASS: Markdown, safe rendering, stable polling, selected revision, draft saving, latest export, project creation/switching/isolation';
 } catch(error) { result.textContent = 'FAIL: ' + error.stack + '\nNotice: '+document.querySelector('iframe').contentDocument.querySelector('#notice')?.textContent+'\nHeadings: '+Array.from(document.querySelector('iframe').contentDocument.querySelectorAll('#paper h2')).map(h=>h.textContent).join(','); }
};
</script></body></html>
