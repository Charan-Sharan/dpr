<!doctype html><html><body><pre id="result">RUNNING</pre><iframe src="/" style="width:1200px;height:750px"></iframe><script>
const result=document.querySelector('#result');
const check=(ok,text)=>{if(!ok)throw Error(text)};
const pause=()=>new Promise(resolve=>setTimeout(resolve,80));
async function until(fn){for(let i=0;i<120;i++){if(await fn())return;await pause()}throw Error('Timed out')}
document.querySelector('iframe').onload=async()=>{try{
 const w=document.querySelector('iframe').contentWindow,d=w.document;
 const selectTab=value=>{const tab=d.querySelector('[data-tab='+value+']');tab.dispatchEvent(new w.MouseEvent('mousedown',{bubbles:true,button:0}));tab.click()};
 const api=async(path,body)=>{const project=new URLSearchParams(w.location.search).get('project')||'default';const r=await w.fetch(path+'?project='+encodeURIComponent(project),{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});return r.json()};
 await until(()=>d.querySelector('#paper h1'));
 const enabled=d.querySelector('#scholarshipEnabled');enabled.click();await until(()=>d.querySelector('#scholarshipPanel'));
 check(!d.querySelector('#scholarshipPanel').hidden,'Scholarship panel hidden');
 d.querySelector('#requestMode').value='revise';d.querySelector('#prompt').value='Revise introduction';
 d.querySelector('#run').click();
 await until(async()=>{await pause();return d.querySelector('#scholarshipContent').textContent.includes('awaiting approval')});
 check(d.querySelector('#paper').textContent.includes('Original prose.'),'Proposal saved automatically');
 selectTab('decisions');await pause();
 check(d.querySelector('#scholarshipContent').textContent.includes('Line-by-line diff'),'Diff missing');
 const proposed=d.querySelector('.decision-proposed'),review=d.querySelector('.decision-review');
 check(proposed.querySelector('.decision-label').textContent==='Proposed text — not saved','DPR proposal heading missing');
 check(review.querySelector('.decision-label').textContent==='Review','DPR review heading missing');
 check(!d.querySelector('.decision-audit'),'Source review ran without optional sources');
 check(!d.querySelector('#scholarshipContent').textContent.includes('Allow without'),'Evidence override still shown');
 check(review.getBoundingClientRect().top>proposed.getBoundingClientRect().bottom,'DPR review overlaps proposed text');
 const approve=Array.from(d.querySelectorAll('#scholarshipContent button')).find(b=>b.textContent==='Allow');
 check(approve,'Approval control missing');approve.click();
 await until(async()=>{await pause();return d.querySelector('#paper').textContent.includes('Proposed scope.')});
 d.querySelector('#prompt').value='Revise introduction again';d.querySelector('#run').click();
 await until(async()=>{await pause();return !!Array.from(d.querySelectorAll('.decision-actions button')).find(b=>b.textContent==='Reject'&&!b.disabled)});
 const beforeReject=(await api('/api/state')).paper.id;
 Array.from(d.querySelectorAll('.decision-actions button')).find(b=>b.textContent==='Reject'&&!b.disabled).click();await until(()=>!Array.from(d.querySelectorAll('.decision-actions button')).some(b=>b.textContent==='Reject'&&!b.disabled));
 check((await api('/api/state')).paper.id===beforeReject,'Reject changed the saved paper');
 selectTab('discussion');await pause();
 check(d.querySelector('#scholarshipContent').textContent.includes('no further action required'),'Approved request still appears to need input');
 check(d.querySelector('#scholarshipContent').textContent.includes('1/1 editing tasks resolved'),'Editing progress missing');
 check(!d.querySelector('#scholarshipContent').textContent.includes('0/6 contributions'),'Editing request shows misleading discussion counter');
 d.querySelector('#requestMode').value='discuss';d.querySelector('#prompt').value='What are we failing to see?';d.querySelector('#run').click();
 await until(async()=>{await pause();return d.querySelectorAll('.contribution').length===6&&d.querySelector('.checkpoint')});
 check(d.querySelector('#paper').textContent.includes('Proposed scope.'),'Inquiry changed document');
 check(d.querySelector('#scholarshipContent').textContent.includes('Researcher checkpoint'),'Checkpoint missing');
 const discussion=d.querySelector('#scholarshipContent').firstChild;
 check(discussion.textContent.includes('What are we failing to see?'),'Latest request not first');
 const nodes=d.querySelector('.contribution');await new Promise(resolve=>setTimeout(resolve,2000));check(nodes===d.querySelector('.contribution'),'Polling rebuilt unchanged conversation');
 selectTab('memory');await pause();check(d.querySelector('#scholarshipContent').textContent.includes('Unverified assumption'),'Memory missing');
 selectTab('activity');await pause();check(d.querySelector('#scholarshipContent').textContent.includes('Calling'),'Provider details missing');
 const sessions=await api('/api/sessions');const job=sessions.sessions.at(-1);
 const events=await api('/api/sessions/'+job.id+'/events');check(events.length>0,'Event API missing');
 const audit=await(await w.fetch(d.querySelector('#exportAudit').href)).json();check(audit.document_version,'Audit export missing');
 d.querySelector('#expandDiscussion').click();await pause();check(d.body.classList.contains('discussion-wide'),'Panel did not expand');
 w.frameElement.style.width='390px';await pause();
 check(d.querySelector('.composer').getBoundingClientRect().width<390,'Composer overflow at mobile width');
 check(d.querySelector('#scholarshipPanel').getBoundingClientRect().width<390,'Discussion overflow at mobile width');
 result.textContent='PASS: opted-in approvals, inquiry, memory, activity, diff, audit and responsive discussion';
}catch(error){result.textContent='FAIL: '+error.message}};
</script></body></html>
